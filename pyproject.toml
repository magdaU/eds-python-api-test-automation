[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "RUF013", "B", "SIM", "UP", "C90", "PLC0415"]

[tool.mypy]
python_version = "3.12"
files = ["client", "models"]
strict = true

[tool.coverage.run]
source = ["client", "models"]

[tool.coverage.report]
fail_under = 90
show_missing = true
