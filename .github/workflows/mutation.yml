name: Mutation checks

# Weekly and manual. Breaks the client on purpose, one line at a time, and fails when the offline tests do not notice
# (scripts/mutation_check.py). Offline only: it never calls the public EDS API.
on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run mutation checks
        run: python scripts/mutation_check.py --report mutation-report.md

      # Shows which changes were killed and which were not, without opening the log.
      - name: Show the mutation report
        if: always()
        run: '[ -f mutation-report.md ] && cat mutation-report.md >> "$GITHUB_STEP_SUMMARY" || true'

      - name: Upload the mutation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutation-report
          path: mutation-report.md
          if-no-files-found: ignore
