name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Find last successful run
        id: last_run
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "tests.yml",
              branch: "main",
              status: "success",
              per_page: 1,
            });
            core.setOutput("run_id", runs.data.workflow_runs[0]?.id ?? "");

      - name: Download previous Allure results
        if: steps.last_run.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: previous-allure-results
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.last_run.outputs.run_id }}

      - name: Prepare Allure history and categories
        run: |
          mkdir -p allure-results/history
          if [ -d previous-allure-results/history ]; then
            cp -r previous-allure-results/history/. allure-results/history/
          fi
          cp allure/categories.json allure-results/categories.json

      - name: Run tests
        run: pytest -v --alluredir=allure-results

      - name: Write Allure executor info
        if: always()
        run: |
          cat > allure-results/executor.json <<EOF
          {
            "name": "GitHub Actions",
            "type": "github",
            "buildName": "Build #${{ github.run_number }}",
            "buildOrder": ${{ github.run_number }},
            "buildUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          EOF

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
