name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Checkout previous report (for Trend history)
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages-previous

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Pull requests run offline tests only; live tests hit the public EDS API, so they run on main.
      - name: Run tests
        run: pytest -v --alluredir=allure-results ${{ github.event_name == 'pull_request' && '-m "not live"' || '' }}

      - name: Write Allure executor info
        if: always()
        run: |
          mkdir -p allure-results
          cat > allure-results/executor.json <<EOF
          {
            "name": "GitHub Actions",
            "type": "github",
            "buildName": "Build #${{ github.run_number }}",
            "buildOrder": ${{ github.run_number }},
            "buildUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          EOF

      - name: Add Allure categories
        if: always()
        run: cp allure/categories.json allure-results/categories.json

      - name: Restore previous report history (for Trend/Duration/Retries/Categories trend)
        if: always()
        run: |
          mkdir -p allure-results/history
          if [ -d gh-pages-previous/history ]; then
            cp -r gh-pages-previous/history/. allure-results/history/
          fi

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: allure-results
          path: allure-results

      - name: Generate Allure report
        if: always()
        run: |
          npm install -g allure-commandline@2.46.1
          allure generate allure-results --clean -o allure-report

      # Requires a one-time manual repo setting that no workflow step can set:
      # Settings -> Pages -> Build and deployment -> Source -> "Deploy from a branch",
      # branch "gh-pages" / (root) -- created automatically by this step on first run,
      # so set it after the first successful push to main.
      - name: Publish Allure report to GitHub Pages
        if: always() && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report
