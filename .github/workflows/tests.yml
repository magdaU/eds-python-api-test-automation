name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      publishable: ${{ steps.guard.outputs.publishable }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Checkout previous report (for Trend history)
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages-previous

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Fails fast on import/collection errors (e.g. a dependency missing from requirements.txt).
      - name: Check test collection
        run: pytest --collect-only -q

      # Pull requests run offline tests only; live tests hit the public EDS API, so they run on main.
      # The exit code is captured instead of failing here, so the guard below decides about the report;
      # the last step fails the job.
      - name: Run tests
        id: pytest
        run: |
          rc=0
          pytest -v --alluredir=allure-results ${{ github.event_name == 'pull_request' && '-m "not live"' || '' }} || rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"

      # Only exit codes 0 (all passed) and 1 (some failed) produce a report worth publishing.
      # 2 (interrupted / collection error), 3, 4, 5 (no tests collected) or empty results would
      # add a bogus 0-test run to the Allure Trend history.
      - name: Guard against empty or broken runs
        id: guard
        env:
          PYTEST_EXIT_CODE: ${{ steps.pytest.outputs.exit_code }}
        run: |
          publishable=true
          if [ "$PYTEST_EXIT_CODE" != "0" ] && [ "$PYTEST_EXIT_CODE" != "1" ]; then
            echo "::error::pytest exited with code $PYTEST_EXIT_CODE (2=interrupted/collection error, 3=internal error, 4=usage error, 5=no tests collected). Skipping Allure report and gh-pages publish."
            publishable=false
          elif ! find allure-results -name '*-result.json' 2>/dev/null | grep -q .; then
            echo "::error::allure-results contains no test results. Skipping Allure report and gh-pages publish."
            publishable=false
          fi
          echo "publishable=$publishable" >> "$GITHUB_OUTPUT"

      - name: Write Allure executor info
        if: steps.guard.outputs.publishable == 'true'
        run: |
          mkdir -p allure-results
          cat > allure-results/executor.json <<EOF
          {
            "name": "GitHub Actions",
            "type": "github",
            "buildName": "Build #${{ github.run_number }}",
            "buildOrder": ${{ github.run_number }},
            "buildUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          EOF

      - name: Add Allure categories
        if: steps.guard.outputs.publishable == 'true'
        run: cp allure/categories.json allure-results/categories.json

      - name: Restore previous report history (for Trend/Duration/Retries/Categories trend)
        if: steps.guard.outputs.publishable == 'true'
        run: |
          mkdir -p allure-results/history
          if [ -d gh-pages-previous/history ]; then
            cp -r gh-pages-previous/history/. allure-results/history/
          fi

      - name: Upload Allure results
        if: always() && steps.guard.outputs.publishable == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: allure-results
          path: allure-results

      - name: Generate Allure report
        if: steps.guard.outputs.publishable == 'true'
        run: |
          npm install -g allure-commandline@2.46.1
          allure generate allure-results --clean -o allure-report

      - name: Upload Allure report
        if: steps.guard.outputs.publishable == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: allure-report
          path: allure-report

      # The report steps above ran (or were skipped by the guard); now fail the job if needed.
      - name: Fail job on test failures or a broken run
        if: always() && steps.pytest.conclusion == 'success'
        env:
          PYTEST_EXIT_CODE: ${{ steps.pytest.outputs.exit_code }}
          PUBLISHABLE: ${{ steps.guard.outputs.publishable }}
        run: |
          if [ "$PUBLISHABLE" != "true" ]; then
            echo "::error::Run was not publishable (see the guard step); failing the job."
            exit 1
          fi
          exit "$PYTEST_EXIT_CODE"

  # Separate job so only the publish step gets write access, and never on pull requests.
  publish:
    needs: test
    if: always() && github.ref == 'refs/heads/main' && needs.test.outputs.publishable == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download Allure report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: allure-report
          path: allure-report

      # Requires a one-time manual repo setting that no workflow step can set:
      # Settings -> Pages -> Build and deployment -> Source -> "Deploy from a branch",
      # branch "gh-pages" / (root) -- created automatically by this step on first run,
      # so set it after the first successful push to main.
      - name: Publish Allure report to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report
