name: Performance

# Manual / nightly only: this hits the public EDS API, so keep the load low.
on:
  workflow_dispatch:
    inputs:
      threads:
        description: Concurrent users
        default: "2"
      duration:
        description: Test duration in seconds
        default: "30"
      max_response_ms:
        description: Max allowed response time per request (ms)
        default: "2000"
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

env:
  JMETER_VERSION: "5.6.3"

jobs:
  jmeter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Install JMeter
        run: |
          base="https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-${JMETER_VERSION}.tgz"
          curl -fsSLO "$base"
          curl -fsSLO "$base.sha512"
          sha512sum -c "apache-jmeter-${JMETER_VERSION}.tgz.sha512"
          tar -xz -C "$HOME" -f "apache-jmeter-${JMETER_VERSION}.tgz"
          echo "$HOME/apache-jmeter-${JMETER_VERSION}/bin" >> "$GITHUB_PATH"

      # Inputs go through env, never straight into the script, so they can't inject shell commands.
      - name: Run JMeter test plan
        working-directory: performance
        env:
          THREADS: ${{ inputs.threads || '2' }}
          DURATION: ${{ inputs.duration || '30' }}
          MAX_RESPONSE_MS: ${{ inputs.max_response_ms || '2000' }}
        run: |
          for value in "$THREADS" "$DURATION" "$MAX_RESPONSE_MS"; do
            [[ "$value" =~ ^[0-9]+$ ]] || { echo "Inputs must be whole numbers, got: $value"; exit 1; }
          done
          jmeter -n -t eds_api_load_test.jmx \
            -l results.jtl -e -o report \
            -Jthreads="$THREADS" \
            -Jduration="$DURATION" \
            -Jmax_response_ms="$MAX_RESPONSE_MS"

      - name: Fail on assertion errors
        working-directory: performance
        run: |
          # results.jtl columns: 8th is "success"; header line is skipped
          failures=$(tail -n +2 results.jtl | awk -F, '$8 == "false"' | wc -l)
          echo "Failed samples: $failures"
          [ "$failures" -eq 0 ]

      - name: Upload JMeter report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jmeter-report
          path: |
            performance/report
            performance/results.jtl
