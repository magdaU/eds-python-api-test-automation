name: Performance

# Manual / weekly only: this hits the public EDS API, so keep the load low.
on:
  workflow_dispatch:
    inputs:
      threads:
        description: Concurrent users
        default: "2"
      duration:
        description: Test duration in seconds
        default: "30"
      max_response_ms:
        description: Max allowed response time per request (ms)
        default: "2000"
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

env:
  JMETER_VERSION: "5.6.3"

jobs:
  jmeter:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Install JMeter
        run: |
          base="https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-${JMETER_VERSION}.tgz"
          curl -fsSLO "$base"
          curl -fsSLO "$base.sha512"
          sha512sum -c "apache-jmeter-${JMETER_VERSION}.tgz.sha512"
          tar -xz -C "$HOME" -f "apache-jmeter-${JMETER_VERSION}.tgz"
          echo "$HOME/apache-jmeter-${JMETER_VERSION}/bin" >> "$GITHUB_PATH"

      # Inputs go through env, never straight into the script, so they can't inject shell commands.
      - name: Run JMeter test plan
        working-directory: performance
        env:
          THREADS: ${{ inputs.threads || '2' }}
          DURATION: ${{ inputs.duration || '30' }}
          MAX_RESPONSE_MS: ${{ inputs.max_response_ms || '2000' }}
        run: |
          for value in "$THREADS" "$DURATION" "$MAX_RESPONSE_MS"; do
            [[ "$value" =~ ^[0-9]+$ ]] || { echo "Inputs must be whole numbers, got: $value"; exit 1; }
          done
          jmeter -n -t eds_api_load_test.jmx \
            -l results.jtl -e -o report \
            -Jthreads="$THREADS" \
            -Jduration="$DURATION" \
            -Jmax_response_ms="$MAX_RESPONSE_MS"

      # Report only: shows the percentiles in the job summary so thresholds can be set from real weekly runs
      # (see docs/test-architecture.md); the pass/fail rules are still the assertions in the plan.
      - name: Summarize response-time percentiles
        if: always()
        working-directory: performance
        env:
          THREADS: ${{ inputs.threads || '2' }}
        run: |
          [ -s results.jtl ] || { echo "No results.jtl to summarize"; exit 0; }
          # results.jtl columns: 2nd is "elapsed" (ms), 8th is "success"
          tail -n +2 results.jtl | awk -F, '$8 == "true" {print $2}' | sort -n > elapsed.txt
          samples=$(wc -l < elapsed.txt)
          [ "$samples" -gt 0 ] || { echo "No successful samples to summarize"; exit 0; }
          percentile() { awk -v p="$1" -v n="$samples" 'BEGIN { x = p * n / 100; i = (x == int(x)) ? x : int(x) + 1; if (i < 1) i = 1 } NR == i { print; exit }' elapsed.txt; }
          {
            echo "### Response times of successful samples"
            echo
            echo "| Users | Samples | p50 | p95 | p99 | max |"
            echo "| ---: | ---: | ---: | ---: | ---: | ---: |"
            echo "| $THREADS | $samples | $(percentile 50) ms | $(percentile 95) ms | $(percentile 99) ms | $(tail -n 1 elapsed.txt) ms |"
            echo
            echo "With few samples p99 is close to the maximum; do not set a p99 limit before there are hundreds."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail on assertion errors
        working-directory: performance
        run: |
          # results.jtl columns: 8th is "success"; header line is skipped
          failures=$(tail -n +2 results.jtl | awk -F, '$8 == "false"' | wc -l)
          echo "Failed samples: $failures"
          [ "$failures" -eq 0 ]

      - name: Upload JMeter report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jmeter-report
          path: |
            performance/report
            performance/results.jtl
