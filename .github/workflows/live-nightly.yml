name: Live nightly

# Pull requests skip live tests (they hit the public EDS API). The daily schedule was removed: the suite has no live tests
# since 2026-11-10, so the scheduled run failed with exit code 5 ("no tests collected"). Run manually only.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eds-live-api
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The repository has no live tests at present. Without this check pytest exits with code 5 ("no tests
      # collected") and the job fails. With it, the job succeeds and says why in the summary.
      - name: Count live tests
        id: count
        run: |
          count=$(pytest -m live --collect-only -q 2>/dev/null | grep -c '::' || true)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" = "0" ]; then
            echo "**Live tests:** none in the repository, nothing was run." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run live tests
        if: steps.count.outputs.count != '0'
        run: pytest -m live -v --junitxml=junit-live.xml

      # Runs even when the tests failed, so the summary shows what failed without opening the logs.
      - name: Summarise the live run
        if: always() && steps.count.outputs.count != '0'
        run: python scripts/summarise_junit.py junit-live.xml >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the JUnit report
        if: always() && steps.count.outputs.count != '0'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: junit-live
          path: junit-live.xml
          if-no-files-found: warn
